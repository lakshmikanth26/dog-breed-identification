<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Dog Breed Identifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-dog"></i>
                <h1>Dog Breed Identifier</h1>
            </div>
        </header>

        <main class="main-content">
            <div class="error-section">
                <div class="error-content">
                    <div class="error-icon">
                        <i class="fas fa-search"></i>
                    </div>
                    <h2>Page Not Found</h2>
                    <p>Oops! The page you're looking for seems to have wandered off like a curious puppy.</p>
                    <div class="error-actions">
                        <a href="{{ url_for('index') }}" class="btn btn-primary">
                            <i class="fas fa-home"></i>
                            Go Home
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024 Dog Breed Identifier. Powered by TensorFlow and Flask.</p>
        </footer>
    </div>
</body>
</html>
